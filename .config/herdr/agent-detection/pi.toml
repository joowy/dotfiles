  { contains = [
    "enter to confirm",
  ] },
  { contains = [
    "enter to select",
  ], any = [
    { contains = [
      "tab/arrow keys to navigate",
    ] },
    { contains = [
      "arrow keys to navigate",
    ] },
    { contains = [
      "arrows to navigate",
    ] },
    { contains = [
      "↑/↓ to navigate",
    ] },
    { contains = [
      "↑↓ to navigate",
    ] },
  ] },
]
