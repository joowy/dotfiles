# WSL2 overlay.
#
# Loaded only when the `wsl2` config environment is selected. On the WSL2
# machine, miserc.local.toml sets `env = ["wsl2"]` in place of the tracked
# `workstation` default, so the KDE desktop applications in
# config.workstation.toml are never installed here. Everything in config.toml
# still applies.
#
# Nothing machine-specific is ported yet. The two known differences are
# documented in the README instead of encoded here:
#
# - colima is a Homebrew formula and nested virtualization usually fails under
#   WSL2, so Docker is expected to come from the host.
# - The nvim config detects WSL and installs the WslClipboard provider for
#   `clip.exe`, so no clipboard setting belongs in this file.

[bootstrap.packages]
